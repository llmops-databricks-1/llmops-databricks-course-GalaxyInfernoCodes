resources:
  jobs:
    create_embeddings_and_index_job:
      name: create-embeddings-and-index
      tags:
        project_name: "llmops-databricks-course-GalaxyInfernoCodes"

      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - ../dist/*.whl

      tasks:
        - task_key: create_embeddings_and_index
          environment_key: default
          spark_python_task:
            python_file: ../scripts/create_embeddings_and_index.py
            parameters:
              - "--project_config_path"
              - "${var.root_path}/project_config.yaml"
