resources:
  jobs:
    parse_pdfs_job:
      name: parse-pdfs
      tags:
        project_name: "llmops-databricks-course-GalaxyInfernoCodes"

      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - ../dist/*.whl

      tasks:
        - task_key: parse_pdfs
          environment_key: default
          spark_python_task:
            python_file: ../scripts/02_parse_pdfs.py
            parameters:
              - "--project_config_path"
              - "${var.root_path}/project_config.yaml"
